name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, Build & Go Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Privacy & leaked-secret scan
        run: |
          if grep -rnE "192\.168\.[0-9]+\.[0-9]+|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" cmd internal web/src; then
            echo "::error::Detected hardcoded private LAN IP or private key in source code"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript project build & Vite bundle
        working-directory: web
        run: ./node_modules/.bin/tsc -b && ./node_modules/.bin/vite build

      - name: Verify bundle preloads
        run: |
          if grep -E "vendor-echarts|vendor-console" web/dist/index.html; then
            echo "::error::vendor-echarts or vendor-console must stay lazy-loaded and not preloaded in index.html"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go race test suite
        run: go test -race -count=1 ./...

      - name: Build single binary & verify CLI version flag
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/jianxcao/pve-dash/internal/version.Version=ci -X github.com/jianxcao/pve-dash/internal/version.Commit=${GITHUB_SHA::7} -X github.com/jianxcao/pve-dash/internal/version.BuildTime=${BUILD_TIME}" \
            -o bin/pve-dash ./cmd/pve-dash
          ./bin/pve-dash --version

  docker:
    name: Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pve-dash:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || 'ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container binary
        run: docker run --rm pve-dash:ci --version
